# E54：构建镜像上的 Windows 发布候选构建。只手工触发，只读仓库，无项目秘密，不写回任何分支。
# pin   ：边界检查 → 完整性预检 → 固定版本工具 → NSIS 预热 → PlanOnly 红门 → Mihomo 取得与核对并生成补丁 → 锁文件与许可汇总 → 两个 crate 的用例
# build ：同上（Mihomo 改为核对已固定哈希）→ 完整 build-release.ps1 → 宿主用例 → 安装包清单核对 → 全部通过才上传 e54-candidate
# 2026-09-22 裁决更新：仓库保持公开，只记录可见性；公开仓库上 build 模式在第一步失败，等 pin 复核与 GPL 源码提供方式裁决后再放行。
name: E54 Windows release build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pin: pin Mihomo and generate inputs, no installer; build: full release build (refused while the repository is public)"
        type: choice
        options:
          - pin
          - build
        default: pin

permissions:
  contents: read

concurrency:
  group: e54-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e54:
    name: E54 (${{ inputs.mode }})
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      E54_MODE: ${{ inputs.mode }}
      E54_REPO_PRIVATE: ${{ github.event.repository.private }}
      E54_RUST_TOOLCHAIN: 1.95.0-x86_64-pc-windows-msvc
      E54_TAURI_CLI_VERSION: 2.10.1
      E54_CARGO_ABOUT_VERSION: 0.8.4
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record run and repository visibility
        id: record
        run: |
          New-Item -ItemType Directory -Force -Path build/logs | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          [ordered]@{
            schema = 'steward-e54-run-1'
            repository = $env:GITHUB_REPOSITORY
            repository_private = $env:E54_REPO_PRIVATE
            ref = $env:GITHUB_REF
            sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            workflow_ref = $env:GITHUB_WORKFLOW_REF
            mode = $env:E54_MODE
            runner = [ordered]@{ os = $env:RUNNER_OS; arch = $env:RUNNER_ARCH; image_os = $env:ImageOS; image_version = $env:ImageVersion; windows = "$($os.Caption) $($os.Version)" }
            started_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json -Depth 4 | Set-Content -Path build/logs/e54-run.json
          "$((Get-Date).ToUniversalTime().ToString('o')) start $((Get-PSDrive -PSProvider FileSystem | ForEach-Object { '{0}: used={1:N1}G free={2:N1}G' -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB) }) -join '; ')" | Add-Content -Path build/logs/e54-disk.log
          if ($env:E54_MODE -eq 'build' -and $env:E54_REPO_PRIVATE -ne 'true') {
            'build mode is not released on a public repository: it waits for the pin review and the GPL source-offer ruling (2026-09-22)'
            exit 1
          }

      - name: Mirror boundary check (before any tool install or dependency download)
        id: boundary
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/release/e54/boundary.ps1 -Tracked -LogFile build/logs/e54-boundary.log
          exit $LASTEXITCODE

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Source completeness preflight
        id: preflight
        run: |
          node tools/release/e54/preflight.mjs | Tee-Object -FilePath build/logs/e54-preflight.json
          exit $LASTEXITCODE

      - name: Install Rust toolchain
        id: rust
        run: |
          rustup toolchain install $env:E54_RUST_TOOLCHAIN --profile minimal --no-self-update 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-rustup.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default $env:E54_RUST_TOOLCHAIN 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-rustup.log -Append
          exit $LASTEXITCODE

      - name: Install tauri-cli and cargo-about
        id: tools
        run: |
          cargo install tauri-cli --version $env:E54_TAURI_CLI_VERSION --locked 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-install-tauri-cli.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo install cargo-about --version $env:E54_CARGO_ABOUT_VERSION --locked 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-install-cargo-about.log
          exit $LASTEXITCODE

      - name: Record and check tool versions
        id: versions
        run: |
          $lines = @("runner_os=$env:RUNNER_OS runner_arch=$env:RUNNER_ARCH image_os=$env:ImageOS image_version=$env:ImageVersion")
          foreach ($command in @(@('node', '--version'), @('rustc', '--version', '--verbose'), @('cargo', '--version'), @('cargo', 'tauri', '--version'), @('cargo', 'about', '--version'), @('rustup', '--version'), @('git', '--version'))) {
            $lines += "> $($command -join ' ')"
            $lines += @(& $command[0] $command[1..($command.Length - 1)] 2>&1 | ForEach-Object { "$_" })
          }
          $lines += '> powershell.exe $PSVersionTable.PSVersion'
          $lines += @(powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')
          $lines += '> 7z'
          $lines += @(& 'C:\Program Files\7-Zip\7z.exe' 2>&1 | ForEach-Object { "$_" } | Where-Object { $_ -match '7-Zip' } | Select-Object -First 1)
          $lines | Set-Content -Path build/logs/tool-versions.txt
          $text = $lines -join "`n"
          $wanted = @('(?m)^v22\.', 'rustc 1\.95\.0 ', 'tauri-cli 2\.10\.1\b', 'cargo-about 0\.8\.4\b', '(?m)^5\.1\.')
          $missing = @($wanted | Where-Object { $text -notmatch $_ })
          if ($missing.Count) { "unexpected tool versions: $($missing -join ', ')"; exit 1 }
          "$((Get-Date).ToUniversalTime().ToString('o')) tools $((Get-PSDrive -PSProvider FileSystem | ForEach-Object { '{0}: used={1:N1}G free={2:N1}G' -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB) }) -join '; ')" | Add-Content -Path build/logs/e54-disk.log

      - name: Warm up Tauri NSIS cache
        id: warmup
        working-directory: tools/release/nsis-warmup
        run: |
          $logs = Resolve-Path ../../../build/logs
          cargo tauri build --bundles nsis 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "$logs/e54-nsis-warmup.log"
          $code = $LASTEXITCODE
          $nsis = Join-Path $env:LOCALAPPDATA 'tauri\NSIS'
          if (Test-Path $nsis) {
            @(Get-ChildItem -LiteralPath $nsis -Recurse -File | Sort-Object FullName | ForEach-Object { [ordered]@{ path = $_.FullName.Substring($nsis.Length + 1).Replace('\', '/'); bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } }) | ConvertTo-Json -Depth 3 | Set-Content -Path "$logs/e54-nsis-cache.json"
          }
          if (Test-Path Cargo.lock) { Copy-Item Cargo.lock "$logs/e54-nsis-warmup.Cargo.lock" }
          Remove-Item target -Recurse -Force -ErrorAction SilentlyContinue
          $makensis = Test-Path (Join-Path $nsis 'makensis.exe')
          "warmup exit=$code makensis=$makensis target_removed=$(-not (Test-Path target))" | Tee-Object -FilePath "$logs/e54-nsis-warmup.log" -Append
          "$((Get-Date).ToUniversalTime().ToString('o')) warmup $((Get-PSDrive -PSProvider FileSystem | ForEach-Object { '{0}: used={1:N1}G free={2:N1}G' -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB) }) -join '; ')" | Add-Content -Path "$logs/e54-disk.log"
          if ($code) { exit $code }
          if (-not $makensis) { exit 1 }

      - name: build-release.ps1 -PlanOnly (red gate, NOT_READY expected)
        id: planonly
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\release\build-release.ps1 -PlanOnly 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-planonly-console.log
          $code = $LASTEXITCODE
          "planonly exit=$code (0=READY, 2=NOT_READY)" | Tee-Object -FilePath build/logs/e54-planonly.txt
          if ($code -ne 0 -and $code -ne 2) { exit $code }
          exit 0

      - name: Mihomo v1.19.30 from official release metadata
        id: mihomo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/release/e54/mihomo-pin.ps1 -Mode $env:E54_MODE 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-mihomo.log
          exit $LASTEXITCODE

      - name: Generate Cargo.lock files and THIRD-PARTY-RUST.txt
        id: licenses
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/release/generate-rust-licenses.ps1 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-licenses.log
          $code = $LASTEXITCODE
          $files = foreach ($path in @('services/control-rs/Cargo.lock', 'apps/desktop-host/vendor/service-ipc/Cargo.lock', 'apps/desktop-host/src-tauri/Cargo.lock', 'build/inputs/THIRD-PARTY-RUST.txt')) {
            if (Test-Path -LiteralPath $path) { [ordered]@{ path = $path; bytes = (Get-Item -LiteralPath $path).Length; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() } }
            else { [ordered]@{ path = $path; missing = $true } }
          }
          [ordered]@{ schema = 'steward-e54-generated-inputs-1'; generated_utc = (Get-Date).ToUniversalTime().ToString('o'); script_exit = $code; files = @($files) } | ConvertTo-Json -Depth 4 | Set-Content -Path build/logs/generated-inputs.json
          "$((Get-Date).ToUniversalTime().ToString('o')) licenses $((Get-PSDrive -PSProvider FileSystem | ForEach-Object { '{0}: used={1:N1}G free={2:N1}G' -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB) }) -join '; ')" | Add-Content -Path build/logs/e54-disk.log
          exit $code

      - name: cargo test control-rs
        id: test_control
        run: |
          cargo test --manifest-path services/control-rs/Cargo.toml 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-test-control.log
          exit $LASTEXITCODE

      - name: cargo test service-ipc (service feature)
        id: test_service
        run: |
          cargo test --features service --manifest-path apps/desktop-host/vendor/service-ipc/Cargo.toml 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-test-service.log
          $code = $LASTEXITCODE
          "$((Get-Date).ToUniversalTime().ToString('o')) crate-tests $((Get-PSDrive -PSProvider FileSystem | ForEach-Object { '{0}: used={1:N1}G free={2:N1}G' -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB) }) -join '; ')" | Add-Content -Path build/logs/e54-disk.log
          exit $code

      - name: Free disk from finished test builds
        id: free_disk
        if: inputs.mode == 'build'
        run: |
          foreach ($directory in @('services/control-rs/target/debug', 'apps/desktop-host/vendor/service-ipc/target/debug')) {
            if (Test-Path $directory) {
              $bytes = (Get-ChildItem -LiteralPath $directory -Recurse -File -Force | Measure-Object -Property Length -Sum).Sum
              Remove-Item -LiteralPath $directory -Recurse -Force
              "$((Get-Date).ToUniversalTime().ToString('o')) removed $directory bytes=$bytes" | Add-Content -Path build/logs/e54-disk.log
            }
          }

      - name: Full build (build-release.ps1)
        id: build
        if: inputs.mode == 'build'
        run: |
          if (Test-Path build/release-staging) {
            Remove-Item build/release-staging -Recurse -Force
            'removed build/release-staging left by this run' | Tee-Object -FilePath build/logs/e54-build-release-console.log
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\release\build-release.ps1 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-build-release-console.log -Append
          $code = $LASTEXITCODE
          "$((Get-Date).ToUniversalTime().ToString('o')) build $((Get-PSDrive -PSProvider FileSystem | ForEach-Object { '{0}: used={1:N1}G free={2:N1}G' -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB) }) -join '; ')" | Add-Content -Path build/logs/e54-disk.log
          exit $code

      - name: cargo test desktop host (tauri feature)
        id: test_host
        if: inputs.mode == 'build'
        run: |
          cargo test --features tauri --manifest-path apps/desktop-host/src-tauri/Cargo.toml 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-test-host.log
          $code = $LASTEXITCODE
          "$((Get-Date).ToUniversalTime().ToString('o')) host-tests $((Get-PSDrive -PSProvider FileSystem | ForEach-Object { '{0}: used={1:N1}G free={2:N1}G' -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB) }) -join '; ')" | Add-Content -Path build/logs/e54-disk.log
          exit $code

      - name: Verify installer contents against release-manifest.json
        id: verify
        if: inputs.mode == 'build'
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/release/e54/verify-installer.ps1 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath build/logs/e54-verify-installer.log
          exit $LASTEXITCODE

      - name: Gate summary
        if: always()
        env:
          G_RECORD: ${{ steps.record.outcome }}
          G_BOUNDARY: ${{ steps.boundary.outcome }}
          G_PREFLIGHT: ${{ steps.preflight.outcome }}
          G_RUST: ${{ steps.rust.outcome }}
          G_TOOLS: ${{ steps.tools.outcome }}
          G_VERSIONS: ${{ steps.versions.outcome }}
          G_WARMUP: ${{ steps.warmup.outcome }}
          G_PLANONLY: ${{ steps.planonly.outcome }}
          G_MIHOMO: ${{ steps.mihomo.outcome }}
          G_LICENSES: ${{ steps.licenses.outcome }}
          G_TEST_CONTROL: ${{ steps.test_control.outcome }}
          G_TEST_SERVICE: ${{ steps.test_service.outcome }}
          G_BUILD: ${{ steps.build.outcome }}
          G_TEST_HOST: ${{ steps.test_host.outcome }}
          G_VERIFY: ${{ steps.verify.outcome }}
        run: |
          New-Item -ItemType Directory -Force -Path build/logs | Out-Null
          $gates = [ordered]@{}
          foreach ($name in @('RECORD', 'BOUNDARY', 'PREFLIGHT', 'RUST', 'TOOLS', 'VERSIONS', 'WARMUP', 'PLANONLY', 'MIHOMO', 'LICENSES', 'TEST_CONTROL', 'TEST_SERVICE', 'BUILD', 'TEST_HOST', 'VERIFY')) {
            $gates[$name.ToLowerInvariant()] = [Environment]::GetEnvironmentVariable("G_$name")
          }
          $failed = @($gates.Keys | Where-Object { $gates[$_] -eq 'failure' })
          $candidate = ($env:E54_MODE -eq 'build') -and (@($gates.Values | Where-Object { $_ -ne 'success' }).Count -eq 0)
          [ordered]@{ schema = 'steward-e54-gates-1'; mode = $env:E54_MODE; repository_private = $env:E54_REPO_PRIVATE; ended_utc = (Get-Date).ToUniversalTime().ToString('o'); candidate = $candidate; first_failure = $(if ($failed.Count) { $failed[0] } else { $null }); gates = $gates } | ConvertTo-Json -Depth 3 | Set-Content -Path build/logs/e54-gates.json
          "$((Get-Date).ToUniversalTime().ToString('o')) end $((Get-PSDrive -PSProvider FileSystem | ForEach-Object { '{0}: used={1:N1}G free={2:N1}G' -f $_.Name, ($_.Used / 1GB), ($_.Free / 1GB) }) -join '; ')" | Add-Content -Path build/logs/e54-disk.log
          $summary = @("## E54 $env:E54_MODE", '', "commit ``$env:GITHUB_SHA`` · run $env:GITHUB_RUN_ID · image $env:ImageOS $env:ImageVersion · private=$env:E54_REPO_PRIVATE", '', '| gate | outcome |', '|---|---|')
          $summary += @($gates.Keys | ForEach-Object { "| $_ | $($gates[$_]) |" })
          $summary += '', "candidate: $candidate"
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload e54-candidate
        id: upload_candidate
        if: ${{ success() && inputs.mode == 'build' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e54-candidate
          path: |
            SOURCE-MIRROR.json
            apps/desktop-host/src-tauri/target/release/bundle/nsis/*.exe
            build/release-staging/release-manifest.json
            services/control-rs/Cargo.lock
            apps/desktop-host/vendor/service-ipc/Cargo.lock
            apps/desktop-host/src-tauri/Cargo.lock
            build/inputs/THIRD-PARTY-RUST.txt
            build/logs/
          if-no-files-found: error
          retention-days: 30

      - name: Upload e54-diagnostics
        id: upload_diagnostics
        if: ${{ always() && !(success() && inputs.mode == 'build') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e54-diagnostics
          path: |
            SOURCE-MIRROR.json
            build/logs/
            build/release-staging/release-manifest.json
            services/control-rs/Cargo.lock
            apps/desktop-host/vendor/service-ipc/Cargo.lock
            apps/desktop-host/src-tauri/Cargo.lock
            build/inputs/THIRD-PARTY-RUST.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Record uploaded artifacts
        if: always()
        env:
          CANDIDATE_ID: ${{ steps.upload_candidate.outputs.artifact-id }}
          CANDIDATE_DIGEST: ${{ steps.upload_candidate.outputs.artifact-digest }}
          DIAGNOSTICS_ID: ${{ steps.upload_diagnostics.outputs.artifact-id }}
          DIAGNOSTICS_DIGEST: ${{ steps.upload_diagnostics.outputs.artifact-digest }}
        run: |
          @('', '| artifact | id | sha256 |', '|---|---|---|', "| e54-candidate | $env:CANDIDATE_ID | $env:CANDIDATE_DIGEST |", "| e54-diagnostics | $env:DIAGNOSTICS_ID | $env:DIAGNOSTICS_DIGEST |") | Add-Content -Path $env:GITHUB_STEP_SUMMARY
