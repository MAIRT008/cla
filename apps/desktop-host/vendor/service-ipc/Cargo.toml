[package]
name = "steward-service-ipc"
version = "2.3.3-steward.1"
description = "AI Environmental Steward 产品网络服务：由固定上游 service-ipc 2.3.3 提交复制改名并收窄，来源与改动见 UPSTREAM.md"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0"
publish = false

[lib]
name = "steward_service_ipc"
path = "src/lib.rs"

[[bin]]
name = "ai-environmental-steward-service"
path = "src/bin/service.rs"
required-features = ["service"]

[[bin]]
name = "ai-environmental-steward-service-install"
path = "src/bin/install_service.rs"
required-features = ["service"]

[[bin]]
name = "ai-environmental-steward-service-uninstall"
path = "src/bin/uninstall_service.rs"
required-features = ["service"]

# 默认特性只含纯逻辑（命令、授权 envelope、受管配置核对、服务状态机与 WFP 键/回滚逻辑），
# 离线单元测试用它即可，不会打开 pipe、启动进程或调用系统 API。
[features]
default = []
client = ["dep:kode-bridge", "dep:tokio"]
service = ["client", "kode-bridge/server", "dep:http", "dep:windows-service"]

# 本机没有 cargo/rustc：依赖未下载、未编译，也没有生成 Cargo.lock（上游锁文件与改动后的依赖不再一致，未复制）。
# kode-bridge 0.4.0 的服务端与客户端签名在 docs.rs 源码页逐项核对过；其余版本沿用上游锁定值或本仓库已用版本。
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.0"
getrandom = "=0.4.3"
kode-bridge = { version = "=0.4.0", optional = true, features = ["client"] }
http = { version = "1.4.2", optional = true }
tokio = { version = "1.52.3", optional = true, features = ["process", "io-util", "rt-multi-thread", "macros", "signal", "fs", "time", "sync", "net"] }

[target.'cfg(windows)'.dependencies]
windows-service = { version = "=0.8.1", optional = true }
# RC6 Round 2：安装助手取安装器所在会话的桌面用户（WTS 会话、账号 SID、配置文件目录）；Round 3 加 Environment，展开 REG_EXPAND_SZ 的配置文件目录。特性按 docs.rs windows-sys 0.61.2 的模块路径核对。
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Environment", "Win32_System_RemoteDesktop", "Win32_System_Registry"] }
